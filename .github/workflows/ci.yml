name: PaperLens quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paperlens
          POSTGRES_USER: paperlens
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperlens -d paperlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests
      - run: python -m compileall -q backend
      - run: python -m backend.evaluation.run smoke --output-dir /tmp/paperlens-evaluation
      - run: PAPERLENS_DATABASE_URL=postgresql+psycopg://paperlens@127.0.0.1:5432/paperlens alembic upgrade head
      - run: PAPERLENS_DATABASE_URL=postgresql+psycopg://paperlens@127.0.0.1:5432/paperlens alembic current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
